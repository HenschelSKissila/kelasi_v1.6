# Garde le projet Supabase actif : un projet gratuit est mis en pause après 7 jours sans activité.
# Requête de lecture hebdomadaire sur l'API REST (aucune donnée n'est modifiée).
# Secrets à créer dans GitHub → Settings → Secrets and variables → Actions :
#   SUPABASE_URL       ex. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  clé publique « anon » ou « publishable » (jamais la clé service_role)
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * 1,4'   # lundi et jeudi à 06:17 UTC (deux fois par semaine, marge de sécurité)
  workflow_dispatch: {}       # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Requête de lecture vers Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL et SUPABASE_ANON_KEY manquants (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/projets?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Réponse HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then echo "Supabase actif."; exit 0; fi
            sleep $((i * 20))
          done
          cat /tmp/body.txt
          echo "::error::Supabase n'a pas répondu correctement (projet en pause ou secrets invalides)."
          exit 1
